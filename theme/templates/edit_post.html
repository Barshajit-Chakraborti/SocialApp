{% extends 'base.html' %}

{% block content %}
<div class="card bg-base-100 shadow-md max-w-md mx-auto">
    <div class="card-body">
        <h2 class="card-title text-2xl mb-4">Edit Post</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-control mb-3">
                <label class="label">Content</label>
                <textarea name="content" class="textarea textarea-bordered" rows="4">{{ post.content }}</textarea>
            </div>
            <div class="form-control mb-5">
                <label class="label">Image</label>
                {% if post.image %}
                    <img src="{{ post.image.url }}" class="rounded-xl w-full mb-2" />
                {% endif %}
                <input type="file" name="image" class="file-input file-input-bordered" />
            </div>
            <div class="flex gap-3">
                <button type="submit" class="btn btn-primary flex-1">Save Changes</button>
                <a href="{% url 'feed' %}" class="btn btn-outline flex-1">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
